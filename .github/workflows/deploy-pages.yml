name: Test BeautiX dashboard

on:
  push:
    branches:
      - test-dashboard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beautix-test-ci
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test dashboard
        uses: actions/checkout@v4
        with:
          ref: test-dashboard
          fetch-depth: 1

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s detailed-analytics.html
          test -s marketing.html
          test -s app.js
          test -s analytics-auth.js
          test -s marketing-test.js
          test -s site-shell.js
          test -s styles.css
          test -s marketing-test.css
          test -s config.js

      - name: Verify local asset references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              Path('index.html'),
              Path('detailed-analytics.html'),
              Path('marketing.html'),
          ]
          missing = []
          for page in pages:
              text = page.read_text(encoding='utf-8')
              for attr in ('src', 'href'):
                  for value in re.findall(rf'{attr}=["\']([^"\']+)["\']', text):
                      clean = value.split('?', 1)[0].split('#', 1)[0]
                      if not clean or clean.startswith(('http://', 'https://', 'mailto:', 'tel:', 'data:', '#')):
                          continue
                      if clean in ('./', '/'):
                          continue
                      target = (page.parent / clean).resolve()
                      if not target.exists():
                          missing.append(f'{page}: {value}')
          if missing:
              raise SystemExit('Missing local references:\n' + '\n'.join(missing))
          PY

      - name: Verify stable application structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html').read_text(encoding='utf-8')
          analytics = Path('detailed-analytics.html').read_text(encoding='utf-8')
          marketing = Path('marketing.html').read_text(encoding='utf-8')

          checks = {
              'login view': 'id="login-view"' in index,
              'app view': 'id="app-view"' in index,
              'dashboard link': 'href="./"' in index,
              'analytics link': 'href="detailed-analytics.html"' in index,
              'marketing link': 'href="marketing.html"' in index,
              'analytics protected view': 'id="analytics-app"' in analytics,
              'marketing protected view': 'id="analytics-app"' in marketing,
              'internal work queue removed': 'id="work-queue"' not in analytics,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Failed structural checks: ' + ', '.join(failed))

          nav_links = re.findall(r'<nav class="sidebar-nav">(.*?)</nav>', index, flags=re.S)
          if not nav_links:
              raise SystemExit('Sidebar navigation block not found')
          hrefs = re.findall(r'href="([^"]+)"', nav_links[0])
          expected = ['./', 'detailed-analytics.html', 'marketing.html']
          if hrefs != expected:
              raise SystemExit(f'Unexpected navigation links: {hrefs}; expected {expected}')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check analytics-auth.js
          node --check marketing-test.js
          node --check site-shell.js
          node --check config.js
