name: Deploy BeautiX live and test dashboards

on:
  push:
    branches:
      - main
      - live
      - test-dashboard
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: beautix-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      live_sha: ${{ steps.versions.outputs.live_sha }}
      test_sha: ${{ steps.versions.outputs.test_sha }}
      live_version: ${{ steps.versions.outputs.live_version }}
      test_version: ${{ steps.versions.outputs.test_version }}
    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch live and test branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            +refs/heads/live:refs/remotes/origin/live \
            +refs/heads/test-dashboard:refs/remotes/origin/test-dashboard

      - name: Resolve source commits
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA="$(git rev-parse refs/remotes/origin/live^{commit})"
          TEST_SHA="$(git rev-parse refs/remotes/origin/test-dashboard^{commit})"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
          {
            echo "live_sha=$LIVE_SHA"
            echo "test_sha=$TEST_SHA"
            echo "live_version=live-v${TIMESTAMP}-${LIVE_SHA:0:8}"
            echo "test_version=test-v${TIMESTAMP}-${TEST_SHA:0:8}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying live commit: $LIVE_SHA"
          echo "Deploying test commit: $TEST_SHA"

      - name: Build combined Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site live-src test-src
          mkdir -p _site/test

          git worktree add --detach live-src "${{ steps.versions.outputs.live_sha }}"
          git worktree add --detach test-src "${{ steps.versions.outputs.test_sha }}"

          rsync -a --delete --exclude='.git' --exclude='.github' live-src/ _site/
          rsync -a --delete --exclude='.git' --exclude='.github' test-src/ _site/test/

          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > _site/version.json <<EOF
          {
            "environment": "live",
            "version": "${{ steps.versions.outputs.live_version }}",
            "source_branch": "live",
            "commit": "${{ steps.versions.outputs.live_sha }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          cat > _site/test/version.json <<EOF
          {
            "environment": "test",
            "version": "${{ steps.versions.outputs.test_version }}",
            "source_branch": "test-dashboard",
            "commit": "${{ steps.versions.outputs.test_sha }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          cat > _site/test/deployment-marker.json <<EOF
          {
            "dashboard": "test",
            "branch": "test-dashboard",
            "commit": "${{ steps.versions.outputs.test_sha }}",
            "version": "${{ steps.versions.outputs.test_version }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          touch _site/.nojekyll

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            _site/index.html
            _site/test/index.html
            _site/test/detailed-analytics.html
            _site/test/styles.css
            _site/test/app.js
            _site/test/analytics-auth.js
            _site/test/site-shell.js
            _site/test/version.json
            _site/test/deployment-marker.json
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty required file: $file"
              exit 1
            fi
          done

          checks=(
            '_site/test/index.html|id="forgot-password-action"'
            '_site/test/index.html|id="site-profile-button"'
            '_site/test/index.html|id="site-profile-modal"'
            '_site/test/index.html|site-shell.js'
            '_site/test/detailed-analytics.html|id="site-profile-button"'
            '_site/test/detailed-analytics.html|id="site-profile-modal"'
            '_site/test/detailed-analytics.html|site-shell.js'
            '_site/test/site-shell.js|const openEditor=async()=>'
            '_site/test/site-shell.js|storage.from("avatars")'
            '_site/test/site-shell.js|window.BeautiXSiteShell={create:createShell}'
            '_site/test/version.json|"source_branch": "test-dashboard"'
            '_site/test/version.json|"commit": "${{ steps.versions.outputs.test_sha }}"'
          )

          for check in "${checks[@]}"; do
            file="${check%%|*}"
            pattern="${check#*|}"
            if ! grep -Fq "$pattern" "$file"; then
              echo "Validation failed: '$pattern' not found in $file"
              exit 1
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify published test revision and shared shell
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ needs.build.outputs.test_sha }}"
          BASE_URL="https://maorlasri.github.io/beautix-live-report/test"

          for attempt in $(seq 1 30); do
            VERSION_JSON="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/version.json?verify=${GITHUB_RUN_ID}-${attempt}" || true)"
            INDEX_HTML="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/?verify=${GITHUB_RUN_ID}-${attempt}" || true)"
            ANALYTICS_HTML="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/detailed-analytics.html?verify=${GITHUB_RUN_ID}-${attempt}" || true)"
            SHELL_JS="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/site-shell.js?verify=${GITHUB_RUN_ID}-${attempt}" || true)"

            if printf '%s' "$VERSION_JSON" | grep -Fq "\"commit\": \"$EXPECTED_SHA\"" \
              && printf '%s' "$INDEX_HTML" | grep -Fq 'id="site-profile-button"' \
              && printf '%s' "$INDEX_HTML" | grep -Fq 'id="site-profile-modal"' \
              && printf '%s' "$INDEX_HTML" | grep -Fq 'site-shell.js' \
              && printf '%s' "$ANALYTICS_HTML" | grep -Fq 'id="site-profile-button"' \
              && printf '%s' "$ANALYTICS_HTML" | grep -Fq 'id="site-profile-modal"' \
              && printf '%s' "$ANALYTICS_HTML" | grep -Fq 'site-shell.js' \
              && printf '%s' "$SHELL_JS" | grep -Fq 'const openEditor=async()=>' \
              && printf '%s' "$SHELL_JS" | grep -Fq 'window.BeautiXSiteShell={create:createShell}'; then
              echo "Published test site matches $EXPECTED_SHA and includes shared profile shell"
              exit 0
            fi

            echo "Attempt $attempt: published site not updated yet"
            sleep 10
          done

          echo "Published test site did not reach expected revision $EXPECTED_SHA"
          exit 1
