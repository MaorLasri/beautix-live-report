name: Version, backup and deploy dashboards

on:
  push:
    branches:
      - test-dashboard
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  version-backup-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout test dashboard branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create backup tag for test publish
        id: test_version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          VERSION="v${TIMESTAMP}-${SHORT_SHA}"
          BACKUP_TAG="backup/test-dashboard/${VERSION}"
          git tag -a "$BACKUP_TAG" -m "Automated backup for test-dashboard publish ${VERSION}"
          git push origin "$BACKUP_TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "backup_tag=$BACKUP_TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare combined live and test site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site live-src test-src
          mkdir -p _site/test

          git clone --depth 1 --branch live https://github.com/${{ github.repository }}.git live-src
          git clone --depth 1 --branch test-dashboard https://github.com/${{ github.repository }}.git test-src

          LIVE_SHA="$(git -C live-src rev-parse HEAD)"
          TEST_SHA="$(git -C test-src rev-parse HEAD)"
          LIVE_VERSION="live-${LIVE_SHA:0:8}"
          TEST_VERSION="${{ steps.test_version.outputs.version }}"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          rsync -a --exclude='.git' --exclude='.github' live-src/ _site/
          rsync -a --exclude='.git' --exclude='.github' test-src/ _site/test/

          cat > _site/version.json <<EOF
          {
            "version": "${LIVE_VERSION}",
            "source_branch": "live",
            "commit": "${LIVE_SHA}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          cat > _site/test/version.json <<EOF
          {
            "version": "${TEST_VERSION}",
            "backup_tag": "${{ steps.test_version.outputs.backup_tag }}",
            "source_branch": "test-dashboard",
            "commit": "${TEST_SHA}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          cat > _site/test/deployment-marker.json <<EOF
          {
            "dashboard": "test",
            "branch": "test-dashboard",
            "commit": "${TEST_SHA}",
            "version": "${TEST_VERSION}"
          }
          EOF

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
