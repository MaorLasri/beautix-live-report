name: Deploy BeautiX

# Only main can deploy: the github-pages environment's branch protection rules
# reject every other branch (runs 339-342 all failed that way). This workflow is
# a deployment controller - it always builds from whatever `live` and `legacy`
# currently point at, so publishing an app change means triggering this workflow,
# not pushing to the app branch. Add `live` back to the trigger list once the
# github-pages environment allows it.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: beautix-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      app_sha: ${{ steps.versions.outputs.app_sha }}
      legacy_sha: ${{ steps.versions.outputs.legacy_sha }}
    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch application branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            +refs/heads/live:refs/remotes/origin/live \
            +refs/heads/legacy:refs/remotes/origin/legacy

      - name: Resolve source commits
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          echo "app_sha=$(git rev-parse refs/remotes/origin/live^{commit})" >> "$GITHUB_OUTPUT"
          echo "legacy_sha=$(git rev-parse refs/remotes/origin/legacy^{commit})" >> "$GITHUB_OUTPUT"

      - name: Build Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site app-src legacy-src
          mkdir -p _site/legacy
          git worktree add --detach app-src "${{ steps.versions.outputs.app_sha }}"
          git worktree add --detach legacy-src "${{ steps.versions.outputs.legacy_sha }}"
          rsync -a --delete --exclude='.git' --exclude='.github' app-src/ _site/
          rsync -a --delete --exclude='.git' --exclude='.github' legacy-src/ _site/legacy/
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > _site/version.json <<EOF
          {"environment":"production","source_branch":"live","commit":"${{ steps.versions.outputs.app_sha }}","published_at_utc":"${PUBLISHED_AT}"}
          EOF
          cat > _site/legacy/version.json <<EOF
          {"environment":"legacy","source_branch":"legacy","commit":"${{ steps.versions.outputs.legacy_sha }}","published_at_utc":"${PUBLISHED_AT}"}
          EOF
          cp _site/legacy/version.json _site/legacy/deployment-marker.json
          touch _site/.nojekyll

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/legacy/index.html
          # promoted app at the root
          grep -Fq 'id="panel-overview"' _site/index.html
          grep -Fq 'data-tab="cashflow"' _site/index.html
          grep -Fq 'app.js' _site/index.html
          # the promoted build must carry no test naming
          if grep -rlF 'test-v2' _site --include='*.html' --include='*.css' \
               --exclude-dir=legacy | grep .; then
            echo "test-v2 references leaked into the promoted build"; exit 1
          fi
          # previous app preserved underneath
          grep -Fq 'id="report-view"' _site/legacy/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify published environments
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            BUSTER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            APP_HTML="$(curl -fsSL --retry 2 --retry-delay 2 "https://maorlasri.github.io/beautix-live-report/?v=$BUSTER" || true)"
            LEGACY_HTML="$(curl -fsSL --retry 2 --retry-delay 2 "https://maorlasri.github.io/beautix-live-report/legacy/?v=$BUSTER" || true)"
            if printf '%s' "$APP_HTML" | grep -Fq 'id="panel-overview"' \
              && printf '%s' "$LEGACY_HTML" | grep -Fq 'id="report-view"'; then
              echo "Production and legacy are published"
              exit 0
            fi
            sleep 10
          done
          echo "Published environments did not pass health check"
          exit 1
