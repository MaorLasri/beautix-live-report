name: Deploy BeautiX live and test dashboards

on:
  push:
    branches:
      - main
      - test-dashboard
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: beautix-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      live_sha: ${{ steps.versions.outputs.live_sha }}
      test_sha: ${{ steps.versions.outputs.test_sha }}
      live_version: ${{ steps.versions.outputs.live_version }}
      test_version: ${{ steps.versions.outputs.test_version }}
    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch live and test branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            +refs/heads/live:refs/remotes/origin/live \
            +refs/heads/test-dashboard:refs/remotes/origin/test-dashboard

      - name: Resolve source commits
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA="$(git rev-parse refs/remotes/origin/live^{commit})"
          TEST_SHA="$(git rev-parse refs/remotes/origin/test-dashboard^{commit})"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
          {
            echo "live_sha=$LIVE_SHA"
            echo "test_sha=$TEST_SHA"
            echo "live_version=live-v${TIMESTAMP}-${LIVE_SHA:0:8}"
            echo "test_version=test-v${TIMESTAMP}-${TEST_SHA:0:8}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying live commit: $LIVE_SHA"
          echo "Deploying test commit: $TEST_SHA"

      - name: Build combined Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site live-src test-src
          mkdir -p _site/test

          git worktree add --detach live-src "${{ steps.versions.outputs.live_sha }}"
          git worktree add --detach test-src "${{ steps.versions.outputs.test_sha }}"

          rsync -a --delete --exclude='.git' --exclude='.github' live-src/ _site/
          rsync -a --delete --exclude='.git' --exclude='.github' test-src/ _site/test/

          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > _site/version.json <<EOF
          {
            "environment": "live",
            "version": "${{ steps.versions.outputs.live_version }}",
            "source_branch": "live",
            "commit": "${{ steps.versions.outputs.live_sha }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          cat > _site/test/version.json <<EOF
          {
            "environment": "test",
            "version": "${{ steps.versions.outputs.test_version }}",
            "source_branch": "test-dashboard",
            "commit": "${{ steps.versions.outputs.test_sha }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          cat > _site/test/deployment-marker.json <<EOF
          {
            "dashboard": "test",
            "branch": "test-dashboard",
            "commit": "${{ steps.versions.outputs.test_sha }}",
            "version": "${{ steps.versions.outputs.test_version }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          touch _site/.nojekyll

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/test/index.html
          test -s _site/test/detailed-analytics.html
          test -s _site/test/styles.css
          test -s _site/test/app.js
          test -s _site/test/analytics-auth.js
          test -s _site/test/version.json
          test -s _site/test/deployment-marker.json
          grep -q 'styles.css?v=20260727-authflow2' _site/test/index.html
          grep -q 'app.js?v=20260727-authflow2' _site/test/index.html
          grep -q 'id="forgot-password-action"' _site/test/index.html
          grep -q 'id="profile-menu-button"' _site/test/index.html
          grep -q 'id="analytics-profile-menu-button"' _site/test/detailed-analytics.html
          grep -q '"source_branch": "test-dashboard"' _site/test/version.json
          grep -q '"commit": "${{ steps.versions.outputs.test_sha }}"' _site/test/version.json
          ! grep -q 'id="work-queue"' _site/test/detailed-analytics.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify published test revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ needs.build.outputs.test_sha }}"
          VERSION_URL="https://maorlasri.github.io/beautix-live-report/test/version.json?verify=${GITHUB_RUN_ID}"
          INDEX_URL="https://maorlasri.github.io/beautix-live-report/test/?verify=${GITHUB_RUN_ID}"

          for attempt in $(seq 1 18); do
            VERSION_JSON="$(curl -fsSL -H 'Cache-Control: no-cache' "$VERSION_URL" || true)"
            INDEX_HTML="$(curl -fsSL -H 'Cache-Control: no-cache' "$INDEX_URL" || true)"

            if printf '%s' "$VERSION_JSON" | grep -q "\"commit\": \"$EXPECTED_SHA\"" \
              && printf '%s' "$INDEX_HTML" | grep -q 'id="forgot-password-action"' \
              && printf '%s' "$INDEX_HTML" | grep -q 'id="profile-menu-button"'; then
              echo "Published test site matches $EXPECTED_SHA"
              exit 0
            fi

            echo "Attempt $attempt: published site not updated yet"
            sleep 10
          done

          echo "Published test site did not reach expected revision $EXPECTED_SHA"
          exit 1
