name: Deploy BeautiX live and test dashboards

on:
  push:
    branches:
      - main
      - test-dashboard
      - live
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: beautix-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch live and test branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/live:refs/remotes/origin/live \
            +refs/heads/test-dashboard:refs/remotes/origin/test-dashboard

      - name: Resolve and verify source commits
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA="$(git rev-parse refs/remotes/origin/live^{commit})"
          TEST_SHA="$(git rev-parse refs/remotes/origin/test-dashboard^{commit})"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"

          if [ "${GITHUB_REF_NAME}" = "test-dashboard" ] && [ "${GITHUB_SHA}" != "${TEST_SHA}" ]; then
            echo "Expected pushed test commit ${GITHUB_SHA}, but fetched ${TEST_SHA}" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" = "live" ] && [ "${GITHUB_SHA}" != "${LIVE_SHA}" ]; then
            echo "Expected pushed live commit ${GITHUB_SHA}, but fetched ${LIVE_SHA}" >&2
            exit 1
          fi

          {
            echo "live_sha=$LIVE_SHA"
            echo "test_sha=$TEST_SHA"
            echo "live_version=live-v${TIMESTAMP}-${LIVE_SHA:0:8}"
            echo "test_version=test-v${TIMESTAMP}-${TEST_SHA:0:8}"
          } >> "$GITHUB_OUTPUT"

      - name: Build combined Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site live-src test-src
          mkdir -p _site/test

          git worktree add --detach live-src "${{ steps.versions.outputs.live_sha }}"
          git worktree add --detach test-src "${{ steps.versions.outputs.test_sha }}"

          rsync -a --delete --exclude='.git' --exclude='.github' live-src/ _site/
          rsync -a --delete --exclude='.git' --exclude='.github' test-src/ _site/test/

          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > _site/version.json <<EOF
          {
            "environment": "live",
            "version": "${{ steps.versions.outputs.live_version }}",
            "source_branch": "live",
            "commit": "${{ steps.versions.outputs.live_sha }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          cat > _site/test/version.json <<EOF
          {
            "environment": "test",
            "version": "${{ steps.versions.outputs.test_version }}",
            "source_branch": "test-dashboard",
            "commit": "${{ steps.versions.outputs.test_sha }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          cat > _site/test/deployment-marker.json <<EOF
          {
            "dashboard": "test",
            "branch": "test-dashboard",
            "commit": "${{ steps.versions.outputs.test_sha }}",
            "version": "${{ steps.versions.outputs.test_version }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          grep -q 'id="login-view"' _site/test/index.html
          grep -q '>דשבורד<' _site/test/index.html
          grep -q '>ניתוחים מפורטים<' _site/test/index.html
          if grep -q 'הלוואות ונכסים</span></a>' _site/test/index.html; then
            echo "Unexpected extra navigation item in test dashboard" >&2
            exit 1
          fi
          if grep -q 'תזרים 30 יום</span></a>' _site/test/index.html; then
            echo "Unexpected extra navigation item in test dashboard" >&2
            exit 1
          fi
          if grep -q 'id="work-queue"' _site/test/detailed-analytics.html; then
            echo "Internal work queue leaked into the test site" >&2
            exit 1
          fi

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
