name: Deploy BeautiX live and test dashboards

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: beautix-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch live and test branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live test-dashboard --tags --force

      - name: Resolve versions and create backups
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LIVE_SHA="$(git rev-parse origin/live)"
          TEST_SHA="$(git rev-parse origin/test-dashboard)"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
          LIVE_VERSION="live-v${TIMESTAMP}-${LIVE_SHA:0:8}"
          TEST_VERSION="test-v${TIMESTAMP}-${TEST_SHA:0:8}"
          LIVE_TAG="backup/live/${LIVE_VERSION}"
          TEST_TAG="backup/test-dashboard/${TEST_VERSION}"

          if ! git rev-parse "$LIVE_TAG" >/dev/null 2>&1; then
            git tag -a "$LIVE_TAG" "$LIVE_SHA" -m "Automated live backup ${LIVE_VERSION}"
            git push origin "$LIVE_TAG"
          fi

          if ! git rev-parse "$TEST_TAG" >/dev/null 2>&1; then
            git tag -a "$TEST_TAG" "$TEST_SHA" -m "Automated test backup ${TEST_VERSION}"
            git push origin "$TEST_TAG"
          fi

          {
            echo "live_sha=$LIVE_SHA"
            echo "test_sha=$TEST_SHA"
            echo "live_version=$LIVE_VERSION"
            echo "test_version=$TEST_VERSION"
            echo "live_tag=$LIVE_TAG"
            echo "test_tag=$TEST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Build combined Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site live-src test-src
          mkdir -p _site/test

          git worktree add --detach live-src "${{ steps.versions.outputs.live_sha }}"
          git worktree add --detach test-src "${{ steps.versions.outputs.test_sha }}"

          rsync -a --delete --exclude='.git' --exclude='.github' live-src/ _site/
          rsync -a --delete --exclude='.git' --exclude='.github' test-src/ _site/test/

          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > _site/version.json <<EOF
          {
            "environment": "live",
            "version": "${{ steps.versions.outputs.live_version }}",
            "backup_tag": "${{ steps.versions.outputs.live_tag }}",
            "source_branch": "live",
            "commit": "${{ steps.versions.outputs.live_sha }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          cat > _site/test/version.json <<EOF
          {
            "environment": "test",
            "version": "${{ steps.versions.outputs.test_version }}",
            "backup_tag": "${{ steps.versions.outputs.test_tag }}",
            "source_branch": "test-dashboard",
            "commit": "${{ steps.versions.outputs.test_sha }}",
            "published_at_utc": "${PUBLISHED_AT}"
          }
          EOF

          cat > _site/test/deployment-marker.json <<EOF
          {
            "dashboard": "test",
            "branch": "test-dashboard",
            "commit": "${{ steps.versions.outputs.test_sha }}",
            "version": "${{ steps.versions.outputs.test_version }}"
          }
          EOF

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
