name: Deploy BeautiX live and test dashboards

on:
  push:
    branches:
      - main
      - live
      - test-dashboard
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: beautix-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      live_sha: ${{ steps.versions.outputs.live_sha }}
      test_sha: ${{ steps.versions.outputs.test_sha }}
      live_version: ${{ steps.versions.outputs.live_version }}
      test_version: ${{ steps.versions.outputs.test_version }}
    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch live and test branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            +refs/heads/live:refs/remotes/origin/live \
            +refs/heads/test-dashboard:refs/remotes/origin/test-dashboard

      - name: Resolve source commits
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA="$(git rev-parse refs/remotes/origin/live^{commit})"
          TEST_SHA="$(git rev-parse refs/remotes/origin/test-dashboard^{commit})"
          TIMESTAMP="$(date -u +'%Y%m%d-%H%M%S')"
          {
            echo "live_sha=$LIVE_SHA"
            echo "test_sha=$TEST_SHA"
            echo "live_version=live-v${TIMESTAMP}-${LIVE_SHA:0:8}"
            echo "test_version=test-v${TIMESTAMP}-${TEST_SHA:0:8}"
          } >> "$GITHUB_OUTPUT"

      - name: Build combined Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site live-src test-src
          mkdir -p _site/test
          git worktree add --detach live-src "${{ steps.versions.outputs.live_sha }}"
          git worktree add --detach test-src "${{ steps.versions.outputs.test_sha }}"
          rsync -a --delete --exclude='.git' --exclude='.github' live-src/ _site/
          rsync -a --delete --exclude='.git' --exclude='.github' test-src/ _site/test/
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > _site/version.json <<EOF
          {"environment":"live","source_branch":"live","commit":"${{ steps.versions.outputs.live_sha }}","published_at_utc":"${PUBLISHED_AT}"}
          EOF
          cat > _site/test/version.json <<EOF
          {"environment":"test","source_branch":"test-dashboard","commit":"${{ steps.versions.outputs.test_sha }}","published_at_utc":"${PUBLISHED_AT}"}
          EOF
          cp _site/test/version.json _site/test/deployment-marker.json
          touch _site/.nojekyll

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/test/index.html
          grep -Fq 'id="login-view"' _site/index.html
          grep -Fq 'id="report-view"' _site/index.html
          grep -Fq 'id="login-view"' _site/test/index.html
          grep -Fq 'id="app-view"' _site/test/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify live and test publication
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            BUSTER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            LIVE_HTML="$(curl -fsSL --retry 2 --retry-delay 2 "https://maorlasri.github.io/beautix-live-report/?v=$BUSTER" || true)"
            TEST_HTML="$(curl -fsSL --retry 2 --retry-delay 2 "https://maorlasri.github.io/beautix-live-report/test/?v=$BUSTER" || true)"
            if printf '%s' "$LIVE_HTML" | grep -Fq 'id="login-view"' \
              && printf '%s' "$LIVE_HTML" | grep -Fq 'id="report-view"' \
              && printf '%s' "$TEST_HTML" | grep -Fq 'id="login-view"' \
              && printf '%s' "$TEST_HTML" | grep -Fq 'id="app-view"'; then
              echo "Live and test dashboards are published"
              exit 0
            fi
            sleep 10
          done
          echo "Published dashboards did not pass health check"
          exit 1
